name: AHQ Browser UX Production Audit
on:
  pull_request:
    paths:
      - "alphahedgequant/scripts/audit-public-ux.mjs"
      - ".github/workflows/browser-ux-audit.yml"
  push:
    branches: [main]
    paths:
      - "alphahedgequant/scripts/audit-public-ux.mjs"
      - ".github/workflows/browser-ux-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-public-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser runner
        working-directory: alphahedgequant
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check live public UX and unauthenticated protected routes
        working-directory: alphahedgequant
        env:
          AHQ_AUDIT_URL: https://www.alphahedgequant.com
        run: node scripts/audit-public-ux.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ahq-public-ux-audit
          path: alphahedgequant/ahq-audit
          retention-days: 7
