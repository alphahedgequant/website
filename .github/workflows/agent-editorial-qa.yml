name: AHQ Editorial Agent QA
on:
  push:
    branches: [main]
    paths:
      - "alphahedgequant/lib/editorialQuality.mjs"
      - "alphahedgequant/tests/editorialQuality.test.mjs"
      - "alphahedgequant/tests/editorialPoster.test.mjs"
      - "alphahedgequant/lib/editorialPoster.mjs"
      - ".github/workflows/agent-editorial-qa.yml"
  pull_request:
    paths:
      - "alphahedgequant/lib/editorialQuality.mjs"
      - "alphahedgequant/tests/editorialQuality.test.mjs"
      - "alphahedgequant/tests/editorialPoster.test.mjs"
      - "alphahedgequant/lib/editorialPoster.mjs"
      - ".github/workflows/agent-editorial-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-policy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test editorial evidence and human publishing approval gates
        working-directory: alphahedgequant
        run: node --test tests/editorialQuality.test.mjs tests/editorialPoster.test.mjs
