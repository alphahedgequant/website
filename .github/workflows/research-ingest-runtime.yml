name: Research Ingestion Runtime Regression
on:
  push:
    branches: [reliability/cron-bounded-runtime]
  pull_request:
    paths:
      - "alphahedgequant/app/api/cron/ingest-research/route.js"
      - "alphahedgequant/tests/researchIngestRuntime.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: alphahedgequant
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: alphahedgequant/package-lock.json
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: Run regression tests
        run: node --test tests/researchIngestRuntime.test.mjs tests/securityBaseline.test.mjs
      - name: Run isolated PostgreSQL JSONB upsert integration test
        env:
          PGPASSWORD: test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h localhost -p 5432 -U test -d postgres -v ON_ERROR_STOP=1 -f tests/researchIngestBatch.sql
      - name: Build website
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk"
        run: npm run build
