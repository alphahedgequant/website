name: Competition Board Public Access Regression
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/competition-public-access.yml"
      - "alphahedgequant/scripts/audit-competitions-public.mjs"
      - "alphahedgequant/middleware.js"
      - "alphahedgequant/app/competitions/**"
      - "alphahedgequant/components/CompetitionBoardFrame.jsx"
      - "alphahedgequant/public/tournaments.html"
      - "alphahedgequant/app/api/tournaments/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-access-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Verify no-login access and protected-route isolation
        working-directory: alphahedgequant
        run: node scripts/audit-competitions-public.mjs
      - name: Probe anonymously published competition routes
        working-directory: alphahedgequant
        env:
          AHQ_LIVE_COMPETITIONS_SMOKE: "1"
        run: node scripts/audit-competitions-public.mjs
