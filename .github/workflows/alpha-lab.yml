name: Alpha Research Lab checks
on:
  pull_request:
    paths:
      - 'alphahedgequant/app/alpha-lab/**'
      - 'alphahedgequant/app/api/alpha-lab/**'
      - 'alphahedgequant/lib/alphaLabEngine.mjs'
      - 'alphahedgequant/scripts/alpha-lab-smoke.mjs'
      - '.github/workflows/alpha-lab.yml'
  push:
    paths:
      - 'alphahedgequant/app/alpha-lab/**'
      - 'alphahedgequant/app/api/alpha-lab/**'
      - 'alphahedgequant/lib/alphaLabEngine.mjs'
      - 'alphahedgequant/scripts/alpha-lab-smoke.mjs'
      - '.github/workflows/alpha-lab.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alphahedgequant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: alphahedgequant/package-lock.json
      - name: Validate expression engine and reproducibility controls
        run: node --test scripts/alpha-lab-smoke.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
