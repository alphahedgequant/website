name: AHQ Market Feed Launch Snapshot
on:
  pull_request:
    paths:
      - ".github/workflows/market-last-mile.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-endpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify real market endpoint readiness without credentials or writes
        working-directory: alphahedgequant
        run: node scripts/audit-market-backend.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ahq-market-last-mile
          path: alphahedgequant/ahq-backend-audit
          retention-days: 7
