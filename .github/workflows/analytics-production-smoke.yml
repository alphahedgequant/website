name: First-Party Analytics Production Smoke
on:
  pull_request:
    paths:
      - ".github/workflows/analytics-production-smoke.yml"
      - "alphahedgequant/scripts/audit-analytics-production.mjs"
  schedule:
    # Each day at 10:30 AM Asia/Kolkata.
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analytics-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify collector, owner protection and synthetic event erasure
        working-directory: alphahedgequant
        run: node scripts/audit-analytics-production.mjs
