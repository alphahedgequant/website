name: AHQ tournament fallback refresh
on:
  # Self-test the updater when its workflow or script changes. Data-only
  # commits never retrigger it, avoiding a refresh/deployment loop.
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-tournaments.yml
      - alphahedgequant/scripts/refresh-tournaments.mjs
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ahq-tournament-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Check Node runtime
        run: node --version
      - name: Refresh upstream snapshots
        run: node "alphahedgequant/scripts/refresh-tournaments.mjs"
      - name: Publish JSON snapshots and sourced news if content changed
        shell: bash
        run: |
          set -euo pipefail
          file="alphahedgequant/public/tournaments-data.json"
          if [[ ! -f "$file" ]]; then exit 0; fi
          git add "$file" "alphahedgequant/public/tournaments-news.json"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "AHQ Data Refresh"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh tournament feeds [skip ci]"
          # Concurrent website commits can advance main during a feed refresh.
          # Rebase the data-only commit; never force-push and never overwrite
          # updated site code. Retry a bounded number of times.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Tournament JSON and news archive published."
              exit 0
            fi
            sleep "$attempt"
          done
          echo "Failed to publish source data after safe rebase retries." >&2
          exit 1
      - name: Dispatch opt-in background notifications using signed GitHub OIDC
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          # Allow the fresh news archive to deploy before dispatch.
          sleep 75
          oidc_response="$(curl -fsS --max-time 15 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ahq-tournament-push-v1")"
          token="$(printf '%s' "$oidc_response" | node -e '
            let d="";process.stdin.on("data",x=>d+=x);
            process.stdin.on("end",()=>{const v=JSON.parse(d).value;if(!v)process.exit(1);process.stdout.write(v)});
          ')
          response="$(curl -fsS --retry 2 --retry-delay 2 --max-time 50 \
            -X POST -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" -d '{}' \
            "https://www.alphahedgequant.com/api/cron/tournament-push")"
          printf '%s\n' "$response"
