name: AHQ tournament live snapshot + push refresh
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-tournaments.yml
      - alphahedgequant/scripts/refresh-tournaments.mjs
  schedule:
    # Every 15 minutes; GitHub may still delay scheduled jobs under load.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ahq-tournament-cache-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check Node runtime
        run: node --version
      - name: Refresh official-source snapshots locally
        run: node "alphahedgequant/scripts/refresh-tournaments.mjs"
      - name: Publish to Neon and dispatch opt-in push with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          # This job does NOT commit refreshed JSON. No Vercel deployment is
          # triggered by a 30-minute data update; the static fallback stays.
          oidc_response="$(curl -fsS --max-time 15 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ahq-tournament-push-v1")"
          token="$(printf '%s' "$oidc_response" | node -e '
            let d="";process.stdin.on("data",x=>d+=x);
            process.stdin.on("end",()=>{const v=JSON.parse(d).value;if(!v)process.exit(1);process.stdout.write(v)});
          ')"
          node -e '
            const fs=require("node:fs");
            const base="alphahedgequant/public/";
            const snapshot=JSON.parse(fs.readFileSync(base+"tournaments-data.json","utf8"));
            const news=JSON.parse(fs.readFileSync(base+"tournaments-news.json","utf8"));
            process.stdout.write(JSON.stringify({snapshot,news}));
          ' > /tmp/ahq-snapshot-payload.json
          status="$(curl -sS --max-time 50 -o /tmp/ahq-cache-result.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/ahq-snapshot-payload.json \
            "https://www.alphahedgequant.com/api/tournaments/cache" || true)"
          if [[ "$status" != "200" ]]; then
            echo "::warning::Live tournament cache returned HTTP $status. Public static backup remains available; production deployment may still be pending."
            exit 0
          fi
          cat /tmp/ahq-cache-result.json
          echo ""
          push_status="$(curl -sS --max-time 50 -o /tmp/ahq-push-result.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" -d '{}' \
            "https://www.alphahedgequant.com/api/cron/tournament-push" || true)"
          if [[ "$push_status" == "200" ]]; then
            cat /tmp/ahq-push-result.json
            echo ""
          else
            echo "::warning::Opt-in push dispatcher returned HTTP $push_status; source data is nevertheless saved."
          fi
