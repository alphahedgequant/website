name: XSS and Dependency Security Audit
on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_code_sinks.py"
      - "alphahedgequant/package.json"
      - "alphahedgequant/package-lock.json"
      - ".github/workflows/xss-dependency-audit.yml"
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-sinks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit application code for dangerous dynamic HTML and executable sinks
        run: python3 scripts/audit_code_sinks.py
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: alphahedgequant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: alphahedgequant/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies for high and critical advisories
        run: npm audit --omit=dev --audit-level=high
