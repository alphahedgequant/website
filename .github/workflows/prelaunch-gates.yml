name: AHQ Prelaunch Read-Only Security Gates
on:
  pull_request:
    paths:
      - "alphahedgequant/scripts/prelaunch-gate.mjs"
      - ".github/workflows/prelaunch-gates.yml"
  push:
    branches: [main]
    paths:
      - "alphahedgequant/scripts/prelaunch-gate.mjs"
      - ".github/workflows/prelaunch-gates.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-production-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify SSL, public routes, no secret exposure, access control, headers
        working-directory: alphahedgequant
        run: node scripts/prelaunch-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ahq-prelaunch-evidence
          path: alphahedgequant/ahq-launch-audit
          retention-days: 7
