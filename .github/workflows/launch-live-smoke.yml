name: AHQ Live Public Smoke
on:
  pull_request:
    paths:
      - "alphahedgequant/tests/launchLiveSmoke.test.mjs"
      - ".github/workflows/launch-live-smoke.yml"
  push:
    branches: [main]
    paths:
      - "alphahedgequant/tests/launchLiveSmoke.test.mjs"
      - ".github/workflows/launch-live-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate TLS home/legal and negative tests for protected endpoints
        working-directory: alphahedgequant
        run: node --test tests/launchLiveSmoke.test.mjs
