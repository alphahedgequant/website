name: Quant Terminal Reliability
on:
  push:
    branches: [main]
    paths:
      - "alphahedgequant/lib/terminalValuation.js"
      - "alphahedgequant/lib/terminalWorkbookData.json"
      - "alphahedgequant/tests/**"
      - ".github/workflows/terminal-reliability.yml"
  pull_request:
    paths:
      - "alphahedgequant/lib/terminalValuation.js"
      - "alphahedgequant/lib/terminalWorkbookData.json"
      - "alphahedgequant/tests/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-data-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute Quant Terminal financial and data tests
        working-directory: alphahedgequant
        run: node --test tests/terminalReliability.test.mjs
