name: NSE discovery worker validation
on:
  pull_request:
    paths:
      - 'alphahedgequant/lib/nseRssDiscovery.mjs'
      - 'alphahedgequant/tests/nseRssDiscovery.test.mjs'
      - 'alphahedgequant/app/api/cron/discover-nse-documents/**'
      - '.github/workflows/nse-discovery-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test alphahedgequant/tests/nseRssDiscovery.test.mjs
