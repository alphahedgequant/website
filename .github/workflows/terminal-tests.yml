name: Terminal volume regression tests
on:
  pull_request:
    paths:
      - 'alphahedgequant/lib/terminalVolume.js'
      - 'alphahedgequant/tests/terminalVolume.test.mjs'
      - '.github/workflows/terminal-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Volume calculation regression tests
        run: node --test alphahedgequant/tests/terminalVolume.test.mjs
