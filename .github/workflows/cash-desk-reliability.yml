name: Cash Quant Desk Reliability
on:
  push:
    branches: [main, feat/cash-quant-desk]
    paths:
      - "alphahedgequant/lib/cashSignals.js"
      - "alphahedgequant/tests/cashSignals.test.cjs"
      - ".github/workflows/cash-desk-reliability.yml"
  pull_request:
    paths:
      - "alphahedgequant/lib/cashSignals.js"
      - "alphahedgequant/tests/cashSignals.test.cjs"
      - ".github/workflows/cash-desk-reliability.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cash-model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test cash-only signal models and scenario safeguards
        working-directory: alphahedgequant
        run: node --test tests/cashSignals.test.cjs
