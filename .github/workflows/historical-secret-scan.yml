name: Historical Secret Indicator Audit
on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_git_secrets.py"
      - ".github/workflows/historical-secret-scan.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  git-history-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check textual historical additions without printing secret material
        run: python3 scripts/audit_git_secrets.py
