name: AHQ Company Graph PostgreSQL Migration
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE_AND_SEED to authorize the additive schema migration and workbook import
        required: true
        type: string
permissions:
  contents: read
jobs:
  migrate-and-seed:
    if: ${{ inputs.confirmation == 'MIGRATE_AND_SEED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ahq-postgres-company-graph
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: python -m pip install 'psycopg[binary]==3.2.3'
      - name: Additive schema migration
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, pathlib, psycopg
          uri=os.environ.get("NEON_DATABASE_URL")
          if not uri:
              raise SystemExit("Missing protected NEON_DATABASE_URL Actions secret")
          sql=pathlib.Path("alphahedgequant/db/001_company_graph.sql").read_text()
          with psycopg.connect(uri,connect_timeout=15) as conn:
              with conn.cursor() as cur:
                  cur.execute(sql)
              conn.commit()
          print("Additive company graph migration complete")
          PY
      - name: Seed historical workbook data as UNVERIFIED
        working-directory: alphahedgequant
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/seed_company_graph.py
