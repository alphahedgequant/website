name: Quant Trading Floor 11-Window Regression
on:
  pull_request:
    paths:
      - 'alphahedgequant/app/terminal/**'
      - 'alphahedgequant/tests/terminalTradingFloor.test.mjs'
      - '.github/workflows/quant-trading-floor.yml'
  push:
    branches: [main, 'feat/quant-terminal-trader-11-windows']
    paths:
      - 'alphahedgequant/app/terminal/**'
      - 'alphahedgequant/tests/terminalTradingFloor.test.mjs'
      - '.github/workflows/quant-trading-floor.yml'
permissions:
  contents: read
jobs:
  floor-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test alphahedgequant/tests/terminalTradingFloor.test.mjs
