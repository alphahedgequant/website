name: Quant Trading Floor 11-Window Regression
on:
  pull_request:
    paths:
      - 'alphahedgequant/app/terminal/**'
      - 'alphahedgequant/tests/terminalTradingFloor.test.mjs'
      - '.github/workflows/quant-trading-floor.yml'
  push:
    branches: [main, 'feat/quant-terminal-trader-11-windows']
    paths:
      - 'alphahedgequant/app/terminal/**'
      - 'alphahedgequant/tests/terminalTradingFloor.test.mjs'
      - '.github/workflows/quant-trading-floor.yml'
permissions:
  contents: read
jobs:
  floor-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test alphahedgequant/tests/terminalTradingFloor.test.mjs
