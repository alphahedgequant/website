version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/alphahedgequant"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 4
